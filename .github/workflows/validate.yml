name: Validate CityChat design identity playground

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Source and rendered validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deterministic release source
        run: npm test

      - name: Install browser dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.54.1
          npx playwright install --with-deps chromium

      - name: Validate rendered states
        run: npm run render

      - name: Confirm validators did not rewrite release source
        run: git diff --exit-code
